org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# If Android builds fail with something like
# "IllegalArgumentException: 25.0.3" deep in the Kotlin-DSL compiler, your
# Android Studio's bundled JBR is on a Java version newer than this
# Gradle/AGP toolchain supports. Fix locally (do not commit a machine path
# here) by adding to this file:
#   org.gradle.java.home=/path/to/a/jdk-17-or-21/install

